[package]
name = "prompt-muse"
version = "0.3.1"
description = "ComfyUI Prompt Management Workstation"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["full"] }
# MCP HTTP server: axum provides the lightweight HTTP layer that runs inside the existing
# tokio runtime, so external AI tools (Claude Desktop, Cursor, etc.) can reach the app's
# capabilities over the Model Context Protocol.
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
once_cell = "1"
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
base64 = "0.22.1"
tauri-plugin-dialog = "2.7.1"
zip = { version = "4.2.0", features = ["deflate"] }
tauri-plugin-fs = "2"
tauri-plugin-notification = "2.3.3"
percent-encoding = "2.3.2"
tauri-plugin-http = "2.5.9"
# App auto-update. The official updater plugin only ships installers for desktop (Windows/macOS/Linux);
# Android uses a custom APK download+install flow (see commands/update.rs). The plugin is registered
# desktop-only in lib.rs, but the crate compiles on all targets so we keep it a normal dependency.
tauri-plugin-updater = "2"
semver = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk-context = "0.1"
